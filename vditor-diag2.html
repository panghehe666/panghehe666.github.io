<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vditor 诊断2</title>
<link rel="stylesheet" href="/vditor/dist/index.css">
<style>body{font-family:sans-serif;padding:10px;} #diag{color:#c00;white-space:pre-wrap;font-size:12px;background:#fff;padding:8px;}</style>
</head>
<body>
<pre id="diag">=== 诊断2 ===</pre>
<div id="ed"></div>
<script>
var t0 = Date.now();
var D = document.getElementById('diag');
function log(s){ D.textContent += '[' + (Date.now()-t0) + 'ms] ' + s + '\n'; }
window.onerror = function(m, s, l){ log('ONERROR ' + m + ' @' + s + ':' + l); };
window.addEventListener('unhandledrejection', function(e){ log('REJECT ' + ((e.reason&&e.reason.message)||e.reason)); });
log('开始');

/* 直接测 lute 可下载性 */
fetch('/vditor/dist/js/lute/lute.min.js').then(function(r){
  log('lute fetch 状态=' + r.status + ' type=' + r.headers.get('content-type') + ' enc=' + r.headers.get('content-encoding'));
  return r.text();
}).then(function(t){
  log('lute 文本长度=' + t.length + ' 用时=' + (Date.now()-t0) + 'ms');
  log('lute 里有 Lute 定义: ' + (t.indexOf('Lute') > -1));
}).catch(function(e){ log('lute fetch 失败: ' + e.message + ' 用时=' + (Date.now()-t0)); });
</script>
<script src="/vditor/dist/index.min.js"></script>
<script>
log('index.min.js 执行完毕, Vditor=' + typeof Vditor);
try { new Vditor('ed', { mode:'ir', value:'# 标题\n\n段落。', cdn:'/vditor', height:240, cache:{enable:false} }); log('构造函数已返回'); }
catch(e){ log('THROW ' + e.message); }
[1000,3000,6000,10000,15000,25000,40000,60000].forEach(function(ms){
  setTimeout(function(){
    log('t检查: .vditor=' + (document.querySelector('#ed .vditor')?'YES':'no') +
        ' toolbar=' + (document.querySelector('#ed .vditor-toolbar')?'YES':'no') +
        ' ir=' + (document.querySelector('#ed .vditor-ir')?'YES':'no') +
        ' Lute=' + (window.Lute?'YES':'no') +
        ' 内容=' + JSON.stringify(((document.querySelector('#ed .vditor-ir')||{}).textContent||'').trim().slice(0,30)));
  }, ms);
});
</script>
</body>
</html>
