---
layout: page
title: "日历"
description: "博客日历 · 贡献率统计"
permalink: /calendar/
header-img: "img/home-bg.jpg"
---

<div markdown="0">
<style>
.cal-root{
  position:relative;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:#243440;line-height:1.65;
  background:
    radial-gradient(900px 420px at 8% -14%, rgba(0,133,161,.10), transparent 60%),
    radial-gradient(760px 380px at 96% -8%, rgba(0,150,190,.08), transparent 55%),
    linear-gradient(180deg,#ffffff 0%,#f4fafb 100%);
  border:1px solid #dcebee;border-radius:18px;padding:26px 24px 22px;
  box-shadow:0 16px 40px rgba(16,64,78,.08);
  margin-bottom:36px;
}
.cal-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.cal-tab{
  appearance:none;border:1px solid #cfe3e8;background:#fff;color:#3d5561;
  padding:8px 18px;border-radius:999px;font-size:14px;cursor:pointer;
  transition:all .18s;letter-spacing:.03em;
}
.cal-tab:hover{background:#f0f9fb;border-color:#0085a1;color:#0085a1;}
.cal-tab.active{background:#0085a1;border-color:#0085a1;color:#fff;box-shadow:0 6px 16px rgba(0,133,161,.22);}
.cal-panel{display:none;}
.cal-panel.active{display:block;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.cal-title{font-size:22px;font-weight:700;letter-spacing:.02em;margin:0;color:#0085a1;}
.cal-nav-btns{display:flex;gap:8px;}
.cal-nav-btns button{
  min-width:36px;height:36px;padding:0 10px;border-radius:10px;border:1px solid #cfe3e8;
  background:#fff;color:#33505c;cursor:pointer;font-size:16px;transition:all .18s;
}
.cal-nav-btns button:hover{background:#e8f7fa;border-color:#0085a1;color:#0085a1;}
.cal-jump{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cal-jump select{
  appearance:none;border:1px solid #cfe3e8;background:#fff;color:#33505c;
  padding:6px 24px 6px 10px;border-radius:9px;font-size:14px;cursor:pointer;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%2333505c" stroke-width="1.4"/></svg>');
  background-repeat:no-repeat;background-position:right 9px center;
}
.cal-jump select:hover,.cal-jump select:focus{border-color:#0085a1;color:#0085a1;outline:none;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:12px;color:#7b93a0;padding:6px 0;letter-spacing:.06em;}
.cal-day{
  min-height:74px;border-radius:12px;border:1px solid #e6f0f3;background:#fbfdfe;padding:8px;
  position:relative;cursor:pointer;transition:background .15s,border-color .15s;
}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-day:hover{background:#f0f9fb;border-color:#cfe3e8;}
.cal-day:focus-visible{outline:2px solid #0085a1;outline-offset:2px;}
.cal-day.has-post{background:#eaf7fa;border-color:#bfe3ea;}
.cal-day.has-post:hover{background:#dff1f6;border-color:#8fd8e3;}
.cal-day.today{border-color:#0085a1;box-shadow:0 0 0 2px rgba(0,133,161,.12) inset;}
.cal-day.sel{border-color:#0085a1;box-shadow:0 0 0 2px #0085a1;}
.cal-day-num{font-size:13px;font-weight:600;color:#54707d;}
.cal-day.today .cal-day-num{color:#0085a1;font-weight:800;}
.cal-day-posts{margin-top:4px;display:flex;flex-direction:column;gap:2px;}
.cal-day-posts a{
  display:block;font-size:11px;color:#0a7c93;text-decoration:none;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.3;
}
.cal-day-posts a:hover{color:#00596b;text-decoration:underline;}
.cal-legend{margin-top:14px;font-size:12px;color:#7b93a0;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.cal-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;}
.cal-day-detail{margin-top:16px;border:1px solid #bfe3ea;background:#f2fafc;border-radius:12px;padding:12px 14px;display:none;}
.cal-day-detail.show{display:block;}
.cal-day-detail .dd-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;}
.cal-day-detail .dd-title{font-size:14px;font-weight:700;color:#00788f;}
.cal-day-detail .dd-close{appearance:none;border:none;background:none;color:#7b93a0;font-size:20px;line-height:1;cursor:pointer;padding:0 6px;border-radius:6px;}
.cal-day-detail .dd-close:hover{background:#dff1f6;color:#00596b;}
.cal-day-detail a{display:block;font-size:13px;color:#0a7c93;text-decoration:none;padding:4px 0;}
.cal-day-detail a:hover{text-decoration:underline;color:#00596b;}
.cal-day-detail .dd-empty{font-size:13px;color:#7b93a0;}
.cal-list{margin-top:18px;}
.cal-list h3{font-size:15px;color:#0085a1;margin:0 0 10px;}
.cal-list-item{
  display:flex;gap:12px;padding:10px 12px;border-radius:10px;
  border:1px solid #e6f0f3;background:#fbfdfe;margin-bottom:8px;
  text-decoration:none;color:inherit;transition:background .15s;
}
.cal-list-item:hover{background:#f0f9fb;text-decoration:none;color:inherit;}
.cal-list-date{font-size:12px;color:#7b93a0;min-width:90px;font-variant-numeric:tabular-nums;}
.cal-list-title{font-size:14px;color:#2a4450;}
.contrib-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.contrib-stat{
  border-radius:14px;border:1px solid #e6f0f3;background:#fbfdfe;
  padding:16px 14px;text-align:center;
}
.contrib-stat .n{font-size:28px;font-weight:800;letter-spacing:.02em;color:#0085a1;}
.contrib-stat .l{font-size:12px;color:#7b93a0;margin-top:4px;letter-spacing:.03em;}
.contrib-heat-wrap{overflow-x:auto;padding-bottom:8px;}
.contrib-months{display:grid;grid-auto-flow:column;grid-template-rows:1fr;gap:3px;width:max-content;
  font-size:11px;color:#8aa3ad;margin-bottom:6px;}
.contrib-months span{width:12px;overflow:visible;white-space:nowrap;}
.contrib-heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;width:max-content;}
.contrib-cell{width:12px;height:12px;border-radius:2px;background:#edf4f6;}
.contrib-cell.l1{background:#cdeef3;}
.contrib-cell.l2{background:#8fd8e3;}
.contrib-cell.l3{background:#3fb6c9;}
.contrib-cell.l4{background:#0085a1;}
.contrib-hint{font-size:12px;color:#7b93a0;margin-top:12px;}
.contrib-gh{
  margin-top:16px;padding:12px 14px;border-radius:12px;border:1px solid #e6f0f3;
  background:#fbfdfe;font-size:13px;color:#3d5561;
}
.contrib-gh a{color:#0085a1;}
@media (max-width:640px){
  .cal-day{min-height:56px;padding:6px;}
  .cal-day-posts{display:none;}
  .cal-day.has-post::after{content:"";position:absolute;left:50%;bottom:6px;width:5px;height:5px;
    margin-left:-2.5px;border-radius:50%;background:#3fb6c9;}
  .cal-root{padding:18px 12px 16px;border-radius:14px;}
  .cal-title{font-size:19px;}
}
</style>

<div class="cal-root">
  <div class="cal-tabs" role="tablist">
    <button type="button" class="cal-tab active" data-tab="calendar" role="tab" aria-selected="true">日历</button>
    <button type="button" class="cal-tab" data-tab="contrib" role="tab" aria-selected="false">贡献率统计</button>
  </div>

  <div id="panel-calendar" class="cal-panel active" role="tabpanel">
    <div class="cal-head">
      <h2 class="cal-title" id="cal-month-label">—</h2>
      <div class="cal-jump">
        <select id="cal-year" aria-label="选择年份"></select>
        <select id="cal-month" aria-label="选择月份"></select>
        <div class="cal-nav-btns">
          <button type="button" id="cal-prev" aria-label="上一月">‹</button>
          <button type="button" id="cal-today" aria-label="今天" title="今天" style="width:auto;padding:0 12px;font-size:13px;">今天</button>
          <button type="button" id="cal-next" aria-label="下一月">›</button>
        </div>
      </div>
    </div>
    <div class="cal-grid" id="cal-dows">
      <div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div>
      <div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div><div class="cal-dow">日</div>
    </div>
    <div class="cal-grid" id="cal-days"></div>
    <div class="cal-legend">
      <span><span class="cal-dot" style="background:#bfe3ea"></span>有文章 · 点任意日期看当天</span>
      <span><span class="cal-dot" style="background:transparent;border:1px solid #0085a1"></span>今天</span>
    </div>
    <div class="cal-day-detail" id="cal-day-detail"></div>
    <div class="cal-list" id="cal-month-list"></div>
  </div>

  <div id="panel-contrib" class="cal-panel" role="tabpanel">
    <div class="cal-head">
      <h2 class="cal-title">博客贡献率</h2>
    </div>
    <div class="contrib-stats" id="contrib-stats"></div>
    <div class="contrib-heat-wrap">
      <div class="contrib-months" id="contrib-months"></div>
      <div class="contrib-heat" id="contrib-heat"></div>
    </div>
    <p class="contrib-hint">格子颜色表示该日发文数量（近一年）。数据来自本站文章发布日期。</p>
    <div class="contrib-gh">
      GitHub 贡献图请直接查看：
      <a href="https://github.com/panghehe666" target="_blank" rel="noopener">github.com/panghehe666</a>
    </div>
  </div>
</div>

<script>
(function () {
  var posts = [
{% for post in site.posts %}
    { date: "{{ post.date | date: '%Y-%m-%d' }}", title: {{ post.title | jsonify }}, url: "{{ post.url | prepend: site.baseurl }}" }{% unless forloop.last %},{% endunless %}
{% endfor %}
  ];

  var byDate = {};
  posts.forEach(function (p) {
    if (!byDate[p.date]) byDate[p.date] = [];
    byDate[p.date].push(p);
  });

  var view = new Date();
  view.setDate(1);

  var yearSel = document.getElementById('cal-year');
  var monthSel = document.getElementById('cal-month');

  function initPicker() {
    var nowY = new Date().getFullYear();
    var minY = nowY, maxY = nowY;
    posts.forEach(function (p) {
      var y = +p.date.slice(0, 4);
      if (y) { if (y < minY) minY = y; if (y > maxY) maxY = y; }
    });
    // 放宽年份范围:过去 10 年 ~ 未来 5 年,方便翻看任意年份
    minY = Math.min(minY, nowY) - 10;
    maxY = Math.max(maxY, nowY) + 5;
    var yh = '';
    for (var y = minY; y <= maxY; y++) yh += '<option value="' + y + '">' + y + '</option>';
    yearSel.innerHTML = yh;
    var mh = '';
    for (var m = 1; m <= 12; m++) mh += '<option value="' + m + '">' + m + '月</option>';
    monthSel.innerHTML = mh;
    syncPicker();
  }
  function syncPicker() {
    var y = String(view.getFullYear());
    if (!yearSel.querySelector('option[value="' + y + '"]')) {
      var o = document.createElement('option');
      o.value = y; o.textContent = y;
      yearSel.appendChild(o);
    }
    yearSel.value = y;
    monthSel.value = String(view.getMonth() + 1);
  }
  function jumpTo(y, m) {
    view = new Date(y, m - 1, 1);
    renderCalendar();
  }
  yearSel.addEventListener('change', function () { jumpTo(+yearSel.value, +monthSel.value); });
  monthSel.addEventListener('change', function () { jumpTo(+yearSel.value, +monthSel.value); });

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function ymd(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  var detailEl = document.getElementById('cal-day-detail');
  var selKey = null;

  function hideDetail() {
    if (detailEl) { detailEl.classList.remove('show'); detailEl.innerHTML = ''; }
    var old = document.querySelector('.cal-day.sel');
    if (old) old.classList.remove('sel');
    selKey = null;
  }

  function showDay(key) {
    var list = (byDate[key] || []).slice();
    var d = key.split('-');
    var label = d[0] + ' 年 ' + (+d[1]) + ' 月 ' + (+d[2]) + ' 日 · ' + list.length + ' 篇';
    var h = '<div class="dd-head"><span class="dd-title">' + esc(label) + '</span>' +
            '<button type="button" class="dd-close" aria-label="关闭">×</button></div>';
    if (list.length) {
      h += list.map(function (p) {
        return '<a href="' + esc(p.url) + '">' + esc(p.title) + '</a>';
      }).join('');
    } else {
      h += '<div class="dd-empty">这天还没有文章</div>';
    }
    detailEl.innerHTML = h;
    detailEl.classList.add('show');
    detailEl.querySelector('.dd-close').addEventListener('click', hideDetail);

    var oldSel = document.querySelector('.cal-day.sel');
    if (oldSel) oldSel.classList.remove('sel');
    var cell = document.querySelector('.cal-day[data-date="' + key + '"]');
    if (cell) cell.classList.add('sel');
    selKey = key;
  }

  function renderCalendar() {
    hideDetail();
    var y = view.getFullYear(), m = view.getMonth();
    document.getElementById('cal-month-label').textContent = y + ' 年 ' + (m + 1) + ' 月';
    var first = new Date(y, m, 1);
    var startPad = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var today = new Date();
    var html = '';
    var monthPosts = [];
    for (var i = 0; i < startPad; i++) html += '<div class="cal-day empty"></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var dt = new Date(y, m, d);
      var key = ymd(dt);
      var list = byDate[key] || [];
      var cls = 'cal-day';
      if (sameDay(dt, today)) cls += ' today';
      if (list.length) cls += ' has-post';
      var extra = ' role="button" tabindex="0" aria-label="' +
        (m + 1) + '月' + d + '日,' + (list.length ? list.length + '篇文章' : '无文章') + '"';
      html += '<div class="' + cls + '" data-date="' + key + '"' + extra + '>';
      html += '<div class="cal-day-num">' + d + '</div>';
      if (list.length) {
        html += '<div class="cal-day-posts">';
        list.slice(0, 2).forEach(function (p) {
          html += '<a href="' + esc(p.url) + '" title="' + esc(p.title) + '">' + esc(p.title) + '</a>';
        });
        if (list.length > 2) html += '<span style="font-size:10px;color:#7b93a0">+' + (list.length - 2) + '</span>';
        html += '</div>';
        list.forEach(function (p) { monthPosts.push(p); });
      }
      html += '</div>';
    }
    document.getElementById('cal-days').innerHTML = html;

    var listEl = document.getElementById('cal-month-list');
    if (!monthPosts.length) {
      listEl.innerHTML = '<h3>本月文章</h3><p style="color:#7b93a0;font-size:13px;">本月暂无文章</p>';
    } else {
      monthPosts.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      var lh = '<h3>本月文章（' + monthPosts.length + '）</h3>';
      monthPosts.forEach(function (p) {
        lh += '<a class="cal-list-item" href="' + esc(p.url) + '"><span class="cal-list-date">' + esc(p.date) +
              '</span><span class="cal-list-title">' + esc(p.title) + '</span></a>';
      });
      listEl.innerHTML = lh;
    }
    syncPicker();
  }

  function renderContrib() {
    var end = new Date();
    end.setHours(0, 0, 0, 0);
    var start = new Date(end);
    start.setDate(start.getDate() - 364);
    start.setDate(start.getDate() - ((start.getDay() + 6) % 7));

    var counts = {};
    var total = 0, activeDays = 0, maxStreak = 0, curStreak = 0, lastActive = null;
    var yearCount = 0;
    var thisYear = end.getFullYear();
    posts.forEach(function (p) {
      counts[p.date] = (counts[p.date] || 0) + 1;
      total++;
      if (p.date.slice(0, 4) == String(thisYear)) yearCount++;
    });

    var heat = document.getElementById('contrib-heat');
    heat.innerHTML = '';
    var monthsEl = document.getElementById('contrib-months');
    monthsEl.innerHTML = '';
    var cursor = new Date(start);
    var names = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    var seen = {};
    var frag = document.createDocumentFragment();
    var mfrag = document.createDocumentFragment();
    while (cursor <= end) {
      var key = ymd(cursor);
      var c = counts[key] || 0;
      var level = c === 0 ? 0 : c === 1 ? 1 : c === 2 ? 2 : c === 3 ? 3 : 4;
      var cell = document.createElement('div');
      cell.className = 'contrib-cell' + (level ? ' l' + level : '');
      cell.title = key + (c ? ' · ' + c + ' 篇' : '');
      frag.appendChild(cell);
      if (c > 0) {
        activeDays++;
        if (lastActive && (cursor - lastActive) / 86400000 === 1) curStreak++;
        else curStreak = 1;
        if (curStreak > maxStreak) maxStreak = curStreak;
        lastActive = new Date(cursor);
      }
      if (cursor.getDay() === 1) {
        var mon = cursor.getMonth();
        var sk = mon + '-' + cursor.getFullYear();
        var ms = document.createElement('span');
        if (!seen[sk]) { seen[sk] = true; ms.textContent = names[mon]; }
        mfrag.appendChild(ms);
      }
      cursor.setDate(cursor.getDate() + 1);
    }
    heat.appendChild(frag);
    monthsEl.appendChild(mfrag);

    document.getElementById('contrib-stats').innerHTML =
      '<div class="contrib-stat"><div class="n">' + total + '</div><div class="l">累计文章</div></div>' +
      '<div class="contrib-stat"><div class="n">' + yearCount + '</div><div class="l">' + thisYear + ' 年发文</div></div>' +
      '<div class="contrib-stat"><div class="n">' + activeDays + '</div><div class="l">近一年有文天数</div></div>' +
      '<div class="contrib-stat"><div class="n">' + maxStreak + '</div><div class="l">最长连续天数</div></div>';
  }

  document.getElementById('cal-prev').onclick = function () {
    view.setMonth(view.getMonth() - 1);
    renderCalendar();
  };
  document.getElementById('cal-next').onclick = function () {
    view.setMonth(view.getMonth() + 1);
    renderCalendar();
  };
  document.getElementById('cal-today').onclick = function () {
    view = new Date();
    view.setDate(1);
    renderCalendar();
  };

  // 点日期(整格)看当天文章
  var daysEl = document.getElementById('cal-days');
  daysEl.addEventListener('click', function (e) {
    var cell = e.target.closest ? e.target.closest('.cal-day') : null;
    if (!cell) return;
    if (e.target.closest('a')) return;      /* 点文章链接直接跳转 */
    showDay(cell.getAttribute('data-date'));
  });
  daysEl.addEventListener('keydown', function (e) {
    var cell = e.target.closest ? e.target.closest('.cal-day[data-date]') : null;
    if (!cell) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      showDay(cell.getAttribute('data-date'));
    } else if (e.key === 'Escape') {
      hideDetail();
    }
  });

  document.querySelectorAll('.cal-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.cal-tab').forEach(function (t) {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.cal-panel').forEach(function (p) { p.classList.remove('active'); });
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      document.getElementById('panel-' + tab.getAttribute('data-tab')).classList.add('active');
      if (tab.getAttribute('data-tab') === 'contrib') renderContrib();
    });
  });

  initPicker();
  renderCalendar();
})();
</script>
</div>
