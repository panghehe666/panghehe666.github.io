<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AI 工具自检</title>
<style>body{font-family:monospace;padding:12px;font-size:13px;white-space:pre-wrap}</style></head>
<body><div id="out">running…</div>
<script>
var out = document.getElementById('out');
function log(s) { out.textContent += '\n' + s; }
var s = document.createElement('script');
s.src = '/js/ai-tools.js?v=' + Date.now();
s.onload = function () { setTimeout(start, 800); };
s.onerror = function () { log('ai-tools.js 加载失败'); };
document.head.appendChild(s);
function start() {
  var key = '';
  try { var st = JSON.parse(sessionStorage.getItem('phh_secrets') || '{}'); key = st.kimi || ''; } catch (e) {}
  log('sessionStorage kimi: ' + (key ? key.slice(0, 8) + '...' : '(无)'));
  if (key) { try { localStorage.setItem('phh_ai_key_kimi', key); } catch (e) {} }
  if (!window.PHAITOOLS) { log('PHAITOOLS 不存在'); return; }
  log('工具列表: ' + PHAITOOLS.names().join(', '));
  var t0 = Date.now();
  PHAITOOLS.run('web_search', { query: '今天有什么科技新闻?一句话概括三条' })
    .then(function (r) {
      log('耗时 ' + ((Date.now() - t0) / 1000).toFixed(1) + 's');
      log('结果:\n' + r.slice(0, 700));
      var src = PHAITOOLS.sources();
      log('来源数: ' + src.length);
    })
    .catch(function (e) { log('失败: ' + e.message); });
}
</script></body></html>
