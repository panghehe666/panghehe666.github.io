---
layout: default
title: 管理员
description: "仅限本人"
permalink: /admin/
nav-style: invert
---

<style>
  body { background: #fff; }
  .admin-stage {
    min-height: 100vh;
    margin-top: -20px;
    padding: 160px 24px 100px;
    background: #fff;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .admin-card {
    width: 100%;
    max-width: 460px;
    padding: 8px 8px 0;
  }
  .admin-kicker {
    font-size: 12px;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: #8a8a8a;
    margin: 0 0 18px;
  }
  .admin-card h1 {
    font-family: "Open Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight: 800;
    letter-spacing: -.03em;
    font-size: 56px;
    line-height: 1;
    margin: 0 0 16px;
    color: #111;
  }
  .admin-rule {
    width: 48px;
    height: 2px;
    background: #111;
    margin: 0 0 22px;
  }
  .admin-card .lead {
    color: #6b6b6b;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 36px;
  }
  .admin-card label {
    display: block;
    font-size: 11px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: #9a9a9a;
    margin-bottom: 18px;
  }
  .admin-field { position: relative; }
  .admin-card input {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 12px 36px 12px 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid #e4e4e4;
    color: #111;
    font-size: 16px;
    outline: none;
  }
  .admin-card input:focus { border-bottom-color: #111; }
  .admin-eye {
    position: absolute;
    right: 0;
    bottom: 10px;
    border: none;
    background: transparent;
    color: #888;
    padding: 4px;
    font-size: 16px;
  }
  .admin-eye:hover { color: #111; }
  .admin-card button[type=submit] {
    width: 100%;
    margin-top: 12px;
    padding: 14px 16px;
    background: #111;
    color: #fff;
    border: none;
    letter-spacing: .32em;
    text-transform: uppercase;
    font-size: 12px;
    font-weight: 700;
  }
  .admin-card button[type=submit]:hover { background: #333; }
  #admin-error { min-height: 1.4em; color: #c0392b; font-size: 13px; margin: 4px 0 12px; }
  .admin-back { display: inline-block; margin-top: 22px; color: #888; font-size: 13px; letter-spacing: .04em; }
  .admin-back:hover { color: #111; }
  #admin-done { display: none; }
  .admin-stage.is-in #admin-form { display: none; }
  .admin-stage.is-in #admin-done { display: block; }
  #admin-logout {
    width: 100%;
    padding: 14px 16px;
    background: #fff;
    color: #111;
    border: 1px solid #111;
    letter-spacing: .32em;
    text-transform: uppercase;
    font-size: 12px;
  }
  .admin-toast {
    position: fixed;
    top: 78px;
    left: 50%;
    z-index: 3000;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: #111;
    color: #fff;
    font-size: 13px;
    letter-spacing: .06em;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -10px);
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .admin-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .admin-toast .fa { color: #7dffa1; }
</style>

<div class="admin-toast" id="admin-toast"><i class="fa fa-check"></i> 你已是管理员</div>

<section class="admin-stage" id="admin-stage">
  <div class="admin-card">
    <form id="admin-form">
      <p class="admin-kicker">Private</p>
      <h1>Admin</h1>
      <div class="admin-rule"></div>
      <p class="lead">进入管理员，查看标记为「隐私」的文章。</p>
      <label>用户名
        <input id="admin-user" type="text" autocomplete="username" spellcheck="false">
      </label>
      <label>密码
        <span class="admin-field">
          <input id="admin-pass" type="password" autocomplete="current-password">
          <button type="button" class="admin-eye" id="admin-eye" aria-label="显示密码"><i class="fa fa-eye"></i></button>
        </span>
      </label>
      <p id="admin-error"></p>
      <button type="submit">Enter</button>
    </form>
    <div id="admin-done">
      <p class="admin-kicker">Inside</p>
      <h1>Admin</h1>
      <div class="admin-rule"></div>
      <p class="lead">已是管理员。隐私文章已对你打开。</p>
      <button type="button" id="admin-logout">登出</button>
    </div>
    <a class="admin-back" href="{{ site.baseurl }}/">← 返回博客</a>
  </div>
</section>

<script>
(function () {
  var USER = "panghehe666";
  var PASS_HASH = "a37ec979c4ced20dacf51ca9a94eaeae5c149ea4b869187aaccad30b47d71f37";
  var KEY = "blog_admin";
  var stage = document.getElementById("admin-stage");
  var toast = document.getElementById("admin-toast");
  var toastTimer = null;

  function on() {
    try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; }
  }
  function paint() {
    stage.classList.toggle("is-in", on());
    document.documentElement.classList.toggle("is-admin", on());
  }
  function nextUrl() {
    var q = new URLSearchParams(location.search).get("next");
    if (q && q.charAt(0) === "/" && q.indexOf("//") !== 0) return q;
    return "/";
  }
  function sha256Hex(text) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
      return Array.from(new Uint8Array(buf)).map(function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }
  function showToast(messageHtml, then) {
    if (toastTimer) clearTimeout(toastTimer);
    toast.classList.remove("show");
    // force reflow so animation can replay
    void toast.offsetWidth;
    if (messageHtml) toast.innerHTML = messageHtml;
    toast.classList.add("show");
    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
      if (typeof then === "function") then();
    }, 1100);
  }

  paint();

  document.getElementById("admin-eye").addEventListener("click", function () {
    var input = document.getElementById("admin-pass");
    var icon = this.querySelector("i");
    var show = input.type === "password";
    input.type = show ? "text" : "password";
    icon.className = show ? "fa fa-eye-slash" : "fa fa-eye";
    this.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
  });

  document.getElementById("admin-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var user = (document.getElementById("admin-user").value || "").trim();
    var pass = document.getElementById("admin-pass").value || "";
    var err = document.getElementById("admin-error");
    if (user !== USER) { err.textContent = "用户名或密码错误"; return; }
    sha256Hex(pass).then(function (hex) {
      if (hex !== PASS_HASH) { err.textContent = "用户名或密码错误"; return; }
      localStorage.setItem(KEY, "1");
      document.documentElement.classList.add("is-admin");
      showToast('<i class="fa fa-check"></i> 你已是管理员', function () {
        location.href = nextUrl();
      });
    });
  });

  document.getElementById("admin-logout").addEventListener("click", function () {
    localStorage.removeItem(KEY);
    document.documentElement.classList.remove("is-admin");
    paint();
    var nav = document.getElementById("admin-login-btn");
    if (nav) nav.innerHTML = '<i class="fa fa-sign-in"></i> 管理员';
    showToast('<i class="fa fa-sign-out"></i> 已登出管理员');
  });
})();
</script>
