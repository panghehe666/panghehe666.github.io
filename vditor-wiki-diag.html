<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双链补全诊断</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/vditor/3.11.3/files/dist/index.css">
<style>body{font-family:sans-serif;padding:8px}#out{white-space:pre-wrap;font-size:11px;background:#f6f8fa;padding:8px;border-radius:6px}</style>
</head><body>
<pre id="out">诊断中…</pre>
<div id="pe-editor"></div>
<script src="https://registry.npmmirror.com/vditor/3.11.3/files/dist/index.min.js"></script>
<script>
var LOG = [];
function log(s){ LOG.push(s); document.getElementById('out').textContent = LOG.join('\n'); }
window.onerror = function(m,s,l){ log('ERR ' + m); };
var vd = null;
try {
  vd = new Vditor('pe-editor', { mode: 'ir', lang: 'zh_CN', value: '# 标题\n\n正文段落', cdn: 'https://registry.npmmirror.com/vditor/3.11.3/files', height: 200, cache: {enable:false} });
  log('构造完成');
} catch(e) { log('THROW ' + e.message); }

/* 记录 input / keyup 是否到达容器 */
var box = document.getElementById('pe-editor');
var inputCount = 0, keyCount = 0;
box.addEventListener('input', function(){ inputCount++; }, true);
box.addEventListener('keyup', function(){ keyCount++; }, true);

function wikiHost(){ return box.querySelector('[contenteditable="true"]'); }
function wikiCaret(){
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) return {err:'no selection'};
  var r = sel.getRangeAt(0);
  if (!r.collapsed) return {err:'not collapsed'};
  var node = r.startContainer;
  if (!node) return {err:'no node'};
  var host = wikiHost();
  if (!host) return {err:'no host'};
  if (!host.contains(node)) return {err:'node outside host', nodeType:node.nodeType, hostTag:host.tagName};
  return { nodeType: node.nodeType, off: r.startOffset, text: (node.nodeType===3?node.textContent:'').slice(0,40) };
}
function wikiMatch(info){
  if (!info || info.err || info.nodeType !== 3) return {err: 'bad info: ' + JSON.stringify(info)};
  var before = info.text;
  var m = before.match(/\[\[([^\[\]\n]{0,40})$/);
  return m ? { q: m[1], len: m[0].length } : {err:'no [[ before caret | text=' + JSON.stringify(before)};
}

setTimeout(function(){
  var host = wikiHost();
  log('host: ' + (host ? host.tagName + '.' + host.className : 'NULL'));
  if (!host) { return; }
  host.focus();
  /* 把光标放到正文末尾 */
  var r = document.createRange();
  r.selectNodeContents(host);
  r.collapse(false);
  var sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(r);
  log('caret placed | caret=' + JSON.stringify(wikiCaret()));
  /* 输入 [[好 */
  var ok = false;
  try { ok = document.execCommand('insertText', false, '[[好'); } catch(e) { log('execCommand 异常 ' + e.message); }
  log('execCommand=' + ok + ' | caret=' + JSON.stringify(wikiCaret()));
  log('match=' + JSON.stringify(wikiMatch(wikiCaret())));
  log('input 事件数=' + inputCount + ' | keyup 数=' + keyCount);
  /* 编辑器内容 */
  try { log('vditor 值: ' + JSON.stringify(String(vd.getValue()).slice(0,60))); } catch(e) { log('getValue 异常'); }
}, 3500);
</script>
</body></html>
