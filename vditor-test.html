<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vditor 自检</title>
<link rel="stylesheet" href="/vditor/dist/index.css">
<style>body{font-family:sans-serif;padding:12px;}#err{color:#c00;white-space:pre-wrap;font-size:12px;margin-top:12px;}</style>
</head>
<body>
<h3>Vditor 自检页</h3>
<div id="ed"></div>
<div id="err"></div>
<script>
window.__log = [];
window.onerror = function(m, s, l){ document.getElementById('err').textContent += '[onerror] ' + m + ' @' + s + ':' + l + '\n'; };
window.addEventListener('unhandledrejection', function(e){ document.getElementById('err').textContent += '[reject] ' + ((e.reason && e.reason.message) || e.reason) + '\n'; });
</script>
<script src="/vditor/dist/index.min.js"></script>
<script>
try {
  document.getElementById('err').textContent += 'Vditor typeof = ' + typeof Vditor + '\n';
  var v = new Vditor('ed', {
    mode: 'ir',
    value: '# 自检标题\n\n表格:\n\n| a | b |\n|---|---|\n| 1 | 2 |\n\n代码:\n\n```js\nvar a = 1;\n```\n\n正文段落。',
    cdn: '/vditor',
    height: 360,
    cache: { enable: false }
  });
  document.getElementById('err').textContent += '构造函数执行完毕\n';
} catch (e) {
  document.getElementById('err').textContent += '[throw] ' + e.message + '\n' + (e.stack || '') + '\n';
}
</script>
</body>
</html>
