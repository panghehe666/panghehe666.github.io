{% unless page.url == '/models/' %}
<a class="lab-fab" href="{{ site.baseurl }}/models/" title="可视化模型实验室"><i class="fa fa-flask"></i>LAB</a>
<style>
.lab-fab{position:fixed;top:64px;right:16px;z-index:1031;display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;background:linear-gradient(135deg,#4f8cff,#9b6bff);color:#fff;font-weight:700;font-size:12px;letter-spacing:.1em;text-decoration:none;box-shadow:0 10px 26px rgba(79,140,255,.5);transition:transform .2s,box-shadow .2s;}
.lab-fab:hover{transform:translateY(-2px) scale(1.05);color:#fff;text-decoration:none;box-shadow:0 14px 34px rgba(79,140,255,.65);}
@media (max-width:768px){.lab-fab{top:56px;right:12px;padding:7px 12px;font-size:11px;}}
</style>
{% endunless %}


<script>
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    var __HuxNav__ = {
        close: function () {
            $navbar.className = " ";
            setTimeout(function () {
                if ($navbar.className.indexOf('in') < 0) {
                    $collapse.style.height = "0px"
                }
            }, 400)
        },
        open: function () {
            $collapse.style.height = "auto"
            $navbar.className += " in";
        }
    }

    $toggle.addEventListener('click', function () {
        if ($navbar.className.indexOf('in') > 0) {
            __HuxNav__.close()
        } else {
            __HuxNav__.open()
        }
    })

    document.addEventListener('click', function (e) {
        if (e.target == $toggle) return;
        if (e.target.className == 'icon-bar') return;
        __HuxNav__.close();
    })
</script>
