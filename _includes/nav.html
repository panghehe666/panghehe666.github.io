<!-- Navigation -->
{% if page.nav-style == "invert" or page.header-style == "text" %}
<nav class="navbar navbar-default navbar-custom navbar-fixed-top invert">
{% else %}
<nav class="navbar navbar-default navbar-custom navbar-fixed-top">
{% endif %}
    <div class="container-fluid">
        <div class="navbar-header page-scroll">
            <button type="button" class="navbar-toggle">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
        </div>

        <div id="huxblog_navbar">
            <div class="navbar-collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li>
                        <a href="{{ site.baseurl }}/">Home</a>
                    </li>
                    <li>
                        <a href="{{ site.baseurl }}/about/">About</a>
                    </li>
                    <li>
                        <a href="{{ site.baseurl }}/archive/">Archive</a>
                    </li>
                    <li class="search-icon">
                        <a href="javascript:void(0)">
                            <i class="fa fa-search"></i>
                        </a>
                    </li>
                    <li>
                        <a href="javascript:void(0)" id="admin-login-btn">登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div id="admin-modal" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);">
    <form id="admin-form" style="background:#fff;max-width:360px;margin:18vh auto;padding:24px 22px;border-radius:6px;">
        <h3 style="margin-top:0;">管理员登录</h3>
        <label style="display:block;margin-bottom:10px;">用户名
            <input id="admin-user" type="text" autocomplete="username" style="display:block;width:100%;margin-top:4px;padding:6px 8px;">
        </label>
        <label style="display:block;margin-bottom:10px;">密码
            <input id="admin-pass" type="password" autocomplete="current-password" style="display:block;width:100%;margin-top:4px;padding:6px 8px;">
        </label>
        <p id="admin-error" style="color:#c0392b;min-height:1.2em;margin:0 0 10px;"></p>
        <button type="submit" class="btn btn-default">登录</button>
        <button type="button" id="admin-cancel" class="btn btn-default">取消</button>
    </form>
</div>

<script>
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    var __HuxNav__ = {
        close: function () {
            $navbar.className = " ";
            setTimeout(function () {
                if ($navbar.className.indexOf('in') < 0) {
                    $collapse.style.height = "0px"
                }
            }, 400)
        },
        open: function () {
            $collapse.style.height = "auto"
            $navbar.className += " in";
        }
    }

    $toggle.addEventListener('click', function (e) {
        if ($navbar.className.indexOf('in') > 0) {
            __HuxNav__.close()
        } else {
            __HuxNav__.open()
        }
    })

    document.addEventListener('click', function (e) {
        if (e.target == $toggle) return;
        if (e.target.className == 'icon-bar') return;
        if (e.target.closest && (e.target.closest('#admin-modal') || e.target.id === 'admin-login-btn')) return;
        __HuxNav__.close();
    })
</script>
