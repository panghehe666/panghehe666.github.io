{% unless page.url == '/calendar/' or page.url == '/models/' %}
<a class="cal-fab" href="{{ site.baseurl }}/calendar/" title="日历" aria-label="日历">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <rect x="3.2" y="5" width="17.6" height="15.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M3.2 10h17.6M8 3.2v3.6M16 3.2v3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</a>
<style>
.cal-fab{position:fixed;bottom:22px;right:18px;z-index:1031;width:44px;height:44px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:#fff;background:#0085a1;
  border:none;text-decoration:none;box-shadow:0 10px 24px rgba(0,133,161,.35);
  transition:transform .18s,background .18s;}
.cal-fab:hover,.cal-fab:focus{color:#fff;background:#006a80;text-decoration:none;transform:translateY(-2px);}
@media (max-width:767px){.cal-fab{bottom:18px;right:16px;width:42px;height:42px;}}
</style>
{% endunless %}

<script>
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    var __HuxNav__ = {
        close: function () {
            $navbar.className = " ";
            setTimeout(function () {
                if ($navbar.className.indexOf('in') < 0) {
                    $collapse.style.height = "0px"
                }
            }, 400)
        },
        open: function () {
            $collapse.style.height = "auto"
            $navbar.className += " in";
        }
    }

    $toggle.addEventListener('click', function () {
        if ($navbar.className.indexOf('in') > 0) {
            __HuxNav__.close()
        } else {
            __HuxNav__.open()
        }
    })

    document.addEventListener('click', function (e) {
        if (e.target == $toggle) return;
        if (e.target.className == 'icon-bar') return;
        __HuxNav__.close();
    })
</script>
