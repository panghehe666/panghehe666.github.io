<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<style>
    html:not(.is-admin) .post-private { display: none !important; }
    html:not(.is-admin) body.is-private-page .intro-header,
    html:not(.is-admin) body.is-private-page article { display: none !important; }
    html:not(.is-admin) body.is-private-page #private-gate { display: block !important; }
    #admin-login-btn .fa { margin-right: 6px; }
    .private-cipher-shell {
      min-height: 120px;
      padding: 28px 0;
      color: #888;
      letter-spacing: .04em;
    }
    .private-decrypt-error { color: #c0392b; }
</style>
<script>
    try {
        if (localStorage.getItem('blog_admin') === '1') {
            document.documentElement.classList.add('is-admin');
        }
    } catch (e) {}
</script>

<body ontouchstart="" class="{% if page.tags contains '隐私' %}is-private-page{% endif %}">

    {% include nav.html %}

    <div id="private-gate" class="container" style="display:none;padding:140px 20px 80px;text-align:center;">
        <h2>这篇文章仅管理员可见</h2>
        <p><a href="{{ site.baseurl }}/admin/?next={{ page.url | url_encode }}">前往管理员页登录</a></p>
    </div>

    {% include search.html %}

    {{ content }}

    {% include footer.html %}

    <script src="{{ '/js/private-crypto.js' | prepend: site.baseurl }}"></script>
    <script src="{{ '/js/admin.js' | prepend: site.baseurl }}"></script>

<img src="/img/icon_wechat.png" width="0" height="0" />

</body>

</html>
